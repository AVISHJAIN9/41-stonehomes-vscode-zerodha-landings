<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign up — WanderZ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="index.html">WanderZ</a>
      <button class="nav-toggle" aria-controls="nav" aria-expanded="false">Menu</button>
      <nav id="nav" class="site-nav" aria-label="Main" aria-hidden="true">
        <ul>
          <li><a href="features.html">Features</a></li>
          <li><a href="pricing.html">Pricing</a></li>
          <li><a href="about.html">About</a></li>
          <li><a class="btn" href="signup.html">Sign up</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <h1>Create account</h1>
    <form class="form" action="#" onsubmit="return false;" aria-label="Create account">
      <label class="visually-hidden" for="s-email">Email address</label>
      <input id="s-email" type="email" placeholder="Email address" required>
      <label class="visually-hidden" for="s-password">Password</label>
      <input id="s-password" type="password" placeholder="Password" required minlength="8">
      <button class="btn btn-primary" type="submit">Create account</button>
    </form>
    <p class="micro">By creating an account you agree to our <a href="#">terms</a>.</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> WanderZ</p>
    </div>
  </footer>

  <script src="js/main.js" defer></script>
</body>
</html>
